name: Build Modrinth Downloader

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            name: modrinth-downloader-linux
            suffix: ""
          - os: windows-latest
            name: modrinth-downloader-windows
            suffix: ".exe"
          - os: macos-latest
            name: modrinth-downloader-macos
            suffix: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyinstaller
      - name: Build CLI (console)
        run: pyinstaller --onefile --name ${{ matrix.name }} --console modpacker.py
        shell: bash
      - name: Build GUI (windowed, Windows/macOS only)
        if: matrix.os != 'ubuntu-latest'
        run: pyinstaller --onefile --windowed --name ${{ matrix.name }}-gui modpacker.py
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            dist/${{ matrix.name }}${{ matrix.suffix }}
            dist/${{ matrix.name }}-gui${{ matrix.suffix }}
          if-no-files-found: ignore

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
