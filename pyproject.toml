[project]
name = "modrinth-downloader"
version = "1.1.0"
description = "Modrinth Downloader - Bridge Modrinth modpacks (.mrpack) into the official Minecraft Launcher"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [{name="OpenCode", email="opencode@github"}]
keywords = ["minecraft", "modrinth", "mrpack", "launcher", "fabric", "forge"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: X11 Applications",
  "Environment :: Win32 (MS Windows)",
  "Environment :: MacOS X",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Games/Entertainment",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/anomalyco/opencode"
Repository = "https://github.com/anomalyco/opencode"

[project.scripts]
modpacker = "modpacker:cli_main"
modrinth-downloader = "modpacker:cli_main"
modrinth_downloader = "modpacker:cli_main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["modpacker"]
omit = ["tests/*"]
